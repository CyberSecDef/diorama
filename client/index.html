<!doctype html>
<html lang="en" data-theme="orbit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>diorama</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="world"></canvas>

  <div id="focus"></div>

  <header id="topbar">
    <div class="left">
      <button id="btn-launcher" class="brand" title="Applications (Ctrl+Alt+Space, or just start typing)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.5 3.6L12 11.5 5.5 7.9 12 4.3ZM5 9.6l6 3.3v6.6l-6-3.3V9.6Zm8 9.9v-6.6l6-3.3v6.6l-6 3.3Z"/></svg>
        <span>diorama</span>
      </button>
      <button id="btn-terminal" class="icon" title="New terminal">&gt;_</button>
      <button id="btn-back" class="pill only-focused" title="Back to the world (Ctrl+Alt+Space)">← World</button>
    </div>
    <div class="center">
      <span id="focus-title" class="only-focused"></span>
      <div class="menu-wrap only-world" id="room-wrap" hidden>
        <button id="btn-room" class="pill" title="Go to another room"><span class="pin">◉</span> <span id="room-name"></span> ▾</button>
        <div class="menu" id="room-menu"></div>
      </div>
    </div>
    <div class="right">
      <button id="btn-fit" class="icon only-focused" title="Resize window to fill the view">⤢</button>
      <button id="btn-close" class="icon only-focused danger" title="Close window">✕</button>
      <span id="identity"></span>
      <span id="clock"></span>
      <div class="menu-wrap">
        <button id="btn-theme" class="icon" title="Switch world">◐</button>
        <div class="menu right" id="theme-menu"></div>
      </div>
      <button id="btn-fullscreen" class="icon" title="Full screen (also captures shortcuts like Ctrl+W for apps)">⛶</button>
      <button id="btn-logout" class="icon" title="Log out">⏻</button>
    </div>
  </header>

  <nav id="taskbar" class="empty"></nav>

  <div id="launcher">
    <div class="launcher-panel">
      <input id="launcher-search" type="search" placeholder="Search applications…" autocomplete="off" spellcheck="false">
      <div id="launcher-grid"></div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="walk-hint" hidden><kbd>↑</kbd><kbd>↓</kbd> walk · <kbd>←</kbd><kbd>→</kbd> turn · <kbd>Shift</kbd> strafe / run · drag to look · click things to use them</div>
  <div id="toasts"></div>
  <div id="offline">Reconnecting…</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
